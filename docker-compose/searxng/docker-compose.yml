name: searxng-stack

services:
  searxng-config-init:
    image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    container_name: searxng-config-init
    restart: "no"
    volumes:
      - searxng-config:/etc/searxng
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:?SEARXNG_SECRET must be set}"
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL:?SEARXNG_BASE_URL must be set}"
    command:
      - sh
      - -c
      - |
        if [ -z "$$SEARXNG_SECRET" ]; then
          echo "ERROR: SEARXNG_SECRET is not set"
          exit 1
        fi

        if [ -z "$$SEARXNG_BASE_URL" ]; then
          echo "ERROR: SEARXNG_BASE_URL is not set"
          exit 1
        fi

        cat > /etc/searxng/settings.yml <<EOF
        use_default_settings: true

        server:
          bind_address: "0.0.0.0"
          port: 8080
          secret_key: "$$SEARXNG_SECRET"
          base_url: "$$SEARXNG_BASE_URL"
          limiter: false
          public_instance: false

        search:
          safe_search: 0
          autocomplete: ""
          default_lang: "auto"
          formats:
            - html
            - json

        valkey:
          url: valkey://valkey:6379/0

        engines:
          - name: ahmia
            disabled: true

          - name: torch
            disabled: true

          - name: wikidata
            disabled: true

          - name: brave
            disabled: true
        EOF

  valkey:
    image: docker.io/valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    container_name: searxng-valkey
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        rm -f /data/dump.rdb
        exec valkey-server --save "" --appendonly no --loglevel warning
    volumes:
      - valkey-data:/data

  searxng:
    image: docker.io/searxng/searxng:2026.10.30-1cd13d98d@sha256:f1bbc31c7bef7a7d8dd2b105c8397eb7dea1eeb7eceebdd45c0c29aef38c0c91
    container_name: searxng-core
    restart: unless-stopped
    depends_on:
      searxng-config-init:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    ports:
      - "8003:8080"
    volumes:
      - searxng-config:/etc/searxng
      - searxng-cache:/var/cache/searxng
    environment:
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL:?SEARXNG_BASE_URL must be set}"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  mcp-searxng:
    image: docker.io/isokoliuk/mcp-searxng:2.9.0@sha256:8f1dd92a9e2875cb4e8df7036785ec4c088b7600cefb611de472a352a3dcba60
    container_name: searxng-mcp
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_healthy
    environment:
      SEARXNG_URL: "http://searxng:8080"
      MCP_HTTP_PORT: "3000"
      HOST: "0.0.0.0"
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_TRUST_PROXY: "1"
    ports:
      - "8005:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  searxng-config:
  searxng-cache:
  valkey-data:
