services:
  mc:
    image: itzg/minecraft-server:2026.10.0-java25@sha256:5a2ab74ae179c11e2dbbce67f307cdcf2c1257b3abb0f654d3a310b3d8ea57da
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      SEED: "7830518263619659759"
      VERSION: "26.3"
      MEMORY: "2048M"
      MAX_PLAYERS: "4"
      MOTD: ${MOTD}
      ICON: ${ICON}
      USE_AIKAR_FLAGS: "true"
      USE_MEOWICE_FLAGS: "true"
      TZ: "Europe/Berlin"
      DIFFICULTY: "2"
      SIMULATION_DISTANCE: "24"
      VIEW_DISTANCE: "24"
      LEVEL: ${LEVEL}
      ENABLE_WHITELIST: "true"
      WHITELIST: ${WHITELIST}
      OPS: ${OPS}
    volumes:
      - "data:/data"
volumes:
  data:
