services:
  mc:
    image: itzg/minecraft-server:java25@sha256:6fd6f9bb6998b7cd06948ec6ab03fabfdf98ba3f2ec030c44069bec9a6bdf09d
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      SEED: "7830518263619659759"
      VERSION: "26.3"
      MEMORY: "2048M"
      MAX_PLAYERS: "4"
      MOTD: ${MOTD}
      ICON: ${ICON}
      USE_AIKAR_FLAGS: "true"
      USE_MEOWICE_FLAGS: "true"
      TZ: "Europe/Berlin"
      DIFFICULTY: "2"
      SIMULATION_DISTANCE: "24"
      VIEW_DISTANCE: "24"
      LEVEL: ${LEVEL}
      ENABLE_WHITELIST: "true"
      WHITELIST: ${WHITELIST}
      OPS: ${OPS}
    volumes:
      - "data:/data"
volumes:
  data:
