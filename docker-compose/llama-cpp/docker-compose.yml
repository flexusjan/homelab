services:
  llm-server:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:003fba3374b3452e5832524f82b29aa48767c1f598311aa8a0cf55075a4314a6
    restart: unless-stopped
    ports:
      - "9001:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m
    volumes:
      - llm_cache:/root/.cache
    devices:
      - /dev/dri:/dev/dri
    environment:
      - GGML_VK_VISIBLE_DEVICES=0
      - HF_TOKEN=${HF_TOKEN:-}
    command:
      - "--hf-repo"
      - "${HF_REPO}"
      - "--hf-file"
      - "${HF_FILE}"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "32768"
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
      - "--cache-ram"
      - "0"
      - "--cache-prompt"
      - "--n-gpu-layers"
      - "all"
      - "--threads"
      - "8"
      - "--threads-batch"
      - "16"
      - "--parallel"
      - "4"
      - "--cont-batching"
      - "--flash-attn"
      - "auto"
      - "--n-predict"
      - "512"
      - "--reasoning"
      - "off"
      - "--metrics"

volumes:
  llm_cache:
