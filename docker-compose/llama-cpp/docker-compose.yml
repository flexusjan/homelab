services:
  llm-model-download:
    image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    volumes:
      - llm_models:/models
    environment:
      MODEL_URL: ${MODEL_URL}
    command: >
      sh -c '
        apk add --no-cache ca-certificates wget &&
        if [ -s "/models/model.gguf" ] && [ "$(cat /models/model.url 2>/dev/null)" = "$$MODEL_URL" ]; then
          echo "Model already exists: /models/model.gguf";
        else
          echo "Downloading model from $$MODEL_URL";
          rm -f /models/model.gguf.part &&
          wget -O /models/model.gguf.part "$$MODEL_URL" &&
          mv /models/model.gguf.part /models/model.gguf &&
          echo "$$MODEL_URL" > /models/model.url;
        fi &&
        ls -lh /models
      '
      
  llm-server:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:8fe0c6ae757c2f5118ab765622d7de1c9f9c4ab5416aa245222332f21e2182bb
    restart: unless-stopped
    depends_on:
      llm-model-download:
        condition: service_completed_successfully
    ports:
      - "9001:8080"
    volumes:
      - llm_models:/models:ro
    devices:
      - /dev/dri:/dev/dri
    environment:
      - GGML_VK_VISIBLE_DEVICES=0
    command:
      - "--model"
      - "/models/model.gguf"
      - "--alias"
      - "${MODEL_ALIAS}"
      - "--host"
      - "0.0.0.0"
      - "--ctx-size"
      - "4096"
      - "--n-gpu-layers"
      - "999"
      - "--parallel"
      - "1"

volumes:
  llm_models:
