services:
  llm-server:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b12648@sha256:298c82bf50830ab711a75a6945fb9a8ffad3972f789d434d32a3c5b0f695e4b0
    restart: unless-stopped
    ports:
      - "9001:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m
    volumes:
      - llm_cache:/root/.cache
    devices:
      - /dev/dri:/dev/dri
    environment:
      - GGML_VK_VISIBLE_DEVICES=0
      - HF_TOKEN=${HF_TOKEN:-}
    command:
      - "--model-url"
      - "https://huggingface.co/saidutta69/LFM3-VL-2B-heretic/resolve/f4cf2cfb5b1289ca4ca10c6c71eb17d147c8c795/LFM3-VL-2B-heretic-Q6_K.gguf"
      - "--mmproj-url"
      - "https://huggingface.co/saidutta69/LFM3-VL-2B-heretic/resolve/f4cf2cfb5b1289ca4ca10c6c71eb17d147c8c795/LFM3-VL-2B-heretic-mmproj-F16.gguf"
      - "--ctx-size"
      - "16384"
      - "--cache-ram"
      - "0"
      - "--n-gpu-layers"
      - "all"
      - "--threads"
      - "8"
      - "--parallel"
      - "1"
      - "--temp"
      - "0.1"
      - "--top-k"
      - "50"
      - "--top-p"
      - "1.0"
      - "--min-p"
      - "0.0"
      - "--repeat-penalty"
      - "1.1"
      - "--metrics"
      - "--reasoning"
      - "on"
      - "--no-reasoning-preserve"
      - "--reasoning-budget"
      - "${LFM_THINK_BUDGET:-256}"

volumes:
  llm_cache:
