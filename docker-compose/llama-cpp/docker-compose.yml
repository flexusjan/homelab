services:
  llm-server:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b11854@sha256:2716be5463dcecd02ace322f77fa0ea10b7168c5c8f0e45458b303541fca6632
    restart: unless-stopped
    ports:
      - "9001:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m
    volumes:
      - llm_cache:/root/.cache
    devices:
      - /dev/dri:/dev/dri
    environment:
      - GGML_VK_VISIBLE_DEVICES=0
      - HF_TOKEN=${HF_TOKEN:-}
      - LLAMA_ARG_MMPROJ_URL=${HF_MMPROJ_URL:-}
    command:
      - "--hf-repo"
      - "${HF_REPO}"
      - "--hf-file"
      - "${HF_FILE}"
      - "--hf-repo-draft"
      - "${HF_DRAFT_REPO:?Set HF_DRAFT_REPO in Portainer}"
      - "--model-draft"
      - "${HF_DRAFT_FILE:?Set HF_DRAFT_FILE in Portainer}"
      - "--spec-type"
      - "draft-mtp"
      - "--ctx-size"
      - "65536"
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
      - "--cache-ram"
      - "0"
      - "--n-gpu-layers"
      - "all"
      - "--flash-attn"
      - "on"
      - "--threads"
      - "8"
      - "--parallel"
      - "1"
      - "--temp"
      - "0.6"
      - "--top-k"
      - "64"
      - "--top-p"
      - "0.9"
      - "--repeat-penalty"
      - "1.1"
      - "--metrics"
      - "--ui-mcp-proxy"

volumes:
  llm_cache:
