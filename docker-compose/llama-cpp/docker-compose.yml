services:
  llm-server:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:6f1a66f0576550c5145cd240d1c4dc5ee4cc08d9492551bbfaf4202efd3a0d95
    restart: unless-stopped
    ports:
      - "9001:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m
    volumes:
      - llm_cache:/root/.cache
    devices:
      - /dev/dri:/dev/dri
    environment:
      - GGML_VK_VISIBLE_DEVICES=0
      - HF_TOKEN=${HF_TOKEN:-}
    command:
      - "--hf-repo"
      - "${HF_REPO}"
      - "--hf-file"
      - "${HF_FILE}"
      - "--no-mmproj"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "8192"
      - "--n-gpu-layers"
      - "all"
      - "--threads"
      - "8"
      - "--threads-batch"
      - "16"
      - "--parallel"
      - "1"
      - "--n-predict"
      - "512"
      - "--reasoning"
      - "off"
      - "--metrics"

volumes:
  llm_cache:
