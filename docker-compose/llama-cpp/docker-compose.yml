services:
  llm-server:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:c463658769e2d4a0f166dbaaf1cd71bf9f4c76e85004212334028deba1ea2543
    restart: unless-stopped
    ports:
      - "9001:8080"
    volumes:
      - llm_cache:/root/.cache/llama.cpp
    devices:
      - /dev/dri:/dev/dri
    environment:
      - GGML_VK_VISIBLE_DEVICES=0
      - HF_TOKEN=${HF_TOKEN:-}
    command:
      - "--hf-repo"
      - "${HF_REPO}"
      - "--hf-file"
      - "${HF_FILE}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "8192"
      - "--n-gpu-layers"
      - "all"
      - "--threads"
      - "8"
      - "--threads-batch"
      - "16"
      - "--parallel"
      - "1"
      - "--n-predict"
      - "512"
      - "--reasoning"
      - "off"
      - "--metrics"

volumes:
  llm_cache:
