services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.09.0@sha256:5b9c8cf51de7d6d3f2240dbe72baf5f06e1fd39cb4d77a99fab4fa13e23bd1be
    pull_policy: always
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "7080:80/tcp"
      - "7443:443/tcp"
    environment:
      TZ: 'Europe/Berlin'
      FTLCONF_webserver_api_password: ${FTLCONF_webserver_api_password}
      FTLCONF_dns_listeningMode: 'all'
    volumes:
      - 'pihole_etc:/etc/pihole'
    restart: unless-stopped
volumes:
  pihole_etc:
