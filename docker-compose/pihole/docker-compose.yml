services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.05.0@sha256:70a9c11171ded2eee735d88c127996da209284a329d50f5ae59c06b861d401b3
    pull_policy: always
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "7080:80/tcp"
      - "7443:443/tcp"
    environment:
      TZ: 'Europe/Berlin'
      FTLCONF_webserver_api_password: ${FTLCONF_webserver_api_password}
      FTLCONF_dns_listeningMode: 'all'
    volumes:
      - 'pihole_etc:/etc/pihole'
    restart: unless-stopped
volumes:
  pihole_etc:
