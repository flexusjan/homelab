services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.11.0@sha256:66c798d79a95c2691f280329c3611dba1746117c61c9f331907ca35a06a52778
    pull_policy: always
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "7080:80/tcp"
      - "7443:443/tcp"
    environment:
      TZ: 'Europe/Berlin'
      FTLCONF_webserver_api_password: ${FTLCONF_webserver_api_password}
      FTLCONF_dns_listeningMode: 'all'
    volumes:
      - 'pihole_etc:/etc/pihole'
    restart: unless-stopped
volumes:
  pihole_etc:
