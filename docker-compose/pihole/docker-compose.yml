services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest@sha256:300cc8f9e966b00440358aafef21f91b32dfe8887e8bd9a6193ed1c4328655d4
    pull_policy: always
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "7080:80/tcp"
      - "7443:443/tcp"
    environment:
      TZ: 'Europe/Berlin'
      FTLCONF_webserver_api_password: ${FTLCONF_webserver_api_password}
      FTLCONF_dns_listeningMode: 'all'
    volumes:
      - 'pihole_etc:/etc/pihole'
    restart: unless-stopped
volumes:
  pihole_etc:
