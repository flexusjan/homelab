services:
  mqtt:
    image: eclipse-mosquitto:2.0.23@sha256:6a332cc7a8dbe011cbc076180cbb76b37c6f0f55809682ea08e7980ef0112ad9
    restart: unless-stopped
    command:
      - sh
      - -ec
      - |
        printf 'listener 1883\nallow_anonymous true\n' > /mosquitto/config/mosquitto.conf
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "127.0.0.1:1883:1883"
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "homelab/health", "-m", "healthy", "-q", "1"]
      interval: 10s
      timeout: 5s
      retries: 5

  danfoss:
    image: eclipse-temurin:21.0.13.1_2-jre-noble@sha256:897ec01ae1350622de0d5393a48a4ffffee8fe1609f248f4389578b919eaf9f5
    restart: unless-stopped
    depends_on:
      mqtt:
        condition: service_healthy
    environment:
      DANFOSS_VERSION: "v0.4.12"
    working_dir: /share/danfoss-icon
    command:
      - sh
      - -ec
      - |
        mkdir -p /data
        curl -fsSL --retry 3 "https://github.com/soundvibe/ha-danfoss/releases/download/$${DANFOSS_VERSION}/ha-danfoss-addon.jar" -o /tmp/app.jar
        cat > /data/options.json <<'EOF'
        {
          "haUpdatePeriodInSeconds": 60,
          "sensorNameFmt": "sensor.danfoss_%d_temperature",
          "port": 9199,
          "mqttEnabled": true,
          "mqttHost": "mqtt",
          "mqttPort": 1883,
          "mqttKeepAlive": 60,
          "mqttUsername": "",
          "mqttPassword": "",
          "logLevel": "info"
        }
        EOF
        exec java --enable-preview -jar /tmp/app.jar
    ports:
      - "9199:9199"
    volumes:
      - danfoss_data:/share/danfoss-icon

volumes:
  danfoss_data:
