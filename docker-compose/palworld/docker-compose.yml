services:
  palworld:
    image: thijsvanloef/palworld-server-docker:latest@sha256:39059e157ea5148f7c4f66c2913c9e844fd62b9fd9de1e7200de8bb4d9bd7a8f
    container_name: palworld-server
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${PORT:-8211}:${PORT:-8211}/udp"
      - "${QUERY_PORT:-27015}:${QUERY_PORT:-27015}/udp"
      - "${REST_API_PORT:-8212}:${REST_API_PORT:-8212}/tcp"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ}
      PORT: ${PORT:-8211}
      QUERY_PORT: ${QUERY_PORT:-27015}
      PLAYERS: ${PLAYERS:-16}
      SERVER_PASSWORD: ${SERVER_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SERVER_NAME: ${SERVER_NAME}
      SERVER_DESCRIPTION: ${SERVER_DESCRIPTION}
      COMMUNITY: ${COMMUNITY}
      CROSSPLAY_PLATFORMS: ${CROSSPLAY_PLATFORMS}
      REST_API_ENABLED: ${REST_API_ENABLED}
      REST_API_PORT: ${REST_API_PORT:-8212}
      UPDATE_ON_BOOT: ${UPDATE_ON_BOOT:-true}
      AUTO_UPDATE_ENABLED: ${AUTO_UPDATE_ENABLED:-false}
      AUTO_UPDATE_CRON_EXPRESSION: "${AUTO_UPDATE_CRON_EXPRESSION:-30 4 * * *}"
      AUTO_UPDATE_WARN_MINUTES: ${AUTO_UPDATE_WARN_MINUTES:-15}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_CRON_EXPRESSION: "${BACKUP_CRON_EXPRESSION:-0 4 * * *}"
      USE_BACKUP_SAVE_DATA: ${USE_BACKUP_SAVE_DATA:-true}
      DELETE_OLD_BACKUPS: ${DELETE_OLD_BACKUPS:-true}
      OLD_BACKUP_DAYS: ${OLD_BACKUP_DAYS:-30}
      AUTO_REBOOT_ENABLED: ${AUTO_REBOOT_ENABLED:-false}
      AUTO_REBOOT_CRON_EXPRESSION: "${AUTO_REBOOT_CRON_EXPRESSION:-0 5 * * *}"
      AUTO_REBOOT_WARN_MINUTES: ${AUTO_REBOOT_WARN_MINUTES:-10}
      AUTO_REBOOT_EVEN_IF_PLAYERS_ONLINE: ${AUTO_REBOOT_EVEN_IF_PLAYERS_ONLINE:-false}
      RCON_ENABLED: ${RCON_ENABLED:-true}
      RCON_PORT: ${RCON_PORT:-25575}
      AUTO_PAUSE_ENABLED: ${AUTO_PAUSE_ENABLED:-false}
      AUTO_PAUSE_TIMEOUT_EST: ${AUTO_PAUSE_TIMEOUT_EST:-300}
      ENABLE_PLAYER_LOGGING: ${ENABLE_PLAYER_LOGGING:-true}
      ENABLE_NON_LOGIN_PENALTY: ${ENABLE_NON_LOGIN_PENALTY:-false}
      ENABLE_VOICE_CHAT: ${ENABLE_VOICE_CHAT:-true}
      VOICE_CHAT_MAX_VOLUME_DISTANCE: ${VOICE_CHAT_MAX_VOLUME_DISTANCE:-10000000.000000}
      VOICE_CHAT_ZERO_VOLUME_DISTANCE: ${VOICE_CHAT_ZERO_VOLUME_DISTANCE:-20000000.000000}
    volumes:
      - palworld_data:/palworld

volumes:
  palworld_data:
